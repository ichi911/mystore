<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Dashboard - MyStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">MyStore</div>
        <div class="menu">
            <a href="index.html">Home & Shop</a>
            <a href="affiliate-dashboard.html" style="color: #6366f1; font-weight: bold;">Affiliate Panel</a>
        </div>
        <div class="nav-right">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div style="max-width: 900px; margin: 40px auto; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Manage Affiliate Products</h2>
            <button class="add-btn" style="width: auto; padding: 10px 20px;" onclick="openAddModal()">+ Add New Product</button>
        </div>

        <!-- Product Management Table/List -->
        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div id="affiliate-products-list">
                <p>Loading your products...</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="product-modal" class="cart-modal">
        <div class="cart-content" style="max-width: 500px;">
            <h2 id="modal-heading">Add Product</h2>
            <input type="hidden" id="prod-id">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="prod-name">
            </div>
            <div class="form-group">
                <label>Price (₱)</label>
                <input type="number" id="prod-price">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="prod-category">
                    <option value="Fashion & Clothing">Fashion & Clothing</option>
                    <option value="Shoes">Shoes</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Home & Living">Home & Living</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Product Image</label>
                <input type="file" id="prod-image" accept="image/*">
            </div>
            <button class="checkout-btn" onclick="saveProduct()">Save Product</button>
            <button class="close-btn" style="margin-top: 10px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUserEmail = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUserEmail = user.email;
            loadAffiliateProducts();
        });

        async function loadAffiliateProducts() {
            let container = document.getElementById('affiliate-products-list');
            try {
                let snapshot = await getDocs(collection(db, "products"));
                let myProducts = [];
                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    if (data.vendor === currentUserEmail) {
                        myProducts.push({ id: docSnap.id, ...data });
                    }
                });

                if (myProducts.length === 0) {
                    container.innerHTML = '<p style="color: #6b7280;">You haven\'t uploaded any products yet.</p>';
                    return;
                }

                container.innerHTML = '';
                myProducts.forEach(p => {
                    let imgTag = p.imageUrl ? `<img src="${p.imageUrl}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; margin-right: 15px;">` : '';
                    let safeName = p.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    container.innerHTML += `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e5e7eb;">
                            <div style="display: flex; align-items: center;">
                                ${imgTag}
                                <div>
                                    <strong>${p.name}</strong>
                                    <p style="font-size: 0.85rem; color: #6b7280;">₱${p.price.toLocaleString()} | ${p.category || 'General'}</p>
                                </div>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <button onclick="openEditModal('${p.id}', '${safeName}', ${p.price}, '${p.category || 'Fashion & Clothing'}')" style="background: #6366f1; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Edit</button>
                                <button onclick="deleteProduct('${p.id}')" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<p style="color: red;">Error loading products.</p>';
            }
        }

        window.openAddModal = function() {
            document.getElementById('modal-heading').innerText = 'Add New Product';
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('product-modal').style.display = 'flex';
        }

        window.openEditModal = function(id, name, price, category) {
            document.getElementById('modal-heading').innerText = 'Edit Product';
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-name').value = name;
            document.getElementById('prod-price').value = price;
            document.getElementById('prod-category').value = category;
            document.getElementById('product-modal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('product-modal').style.display = 'none';
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        window.saveProduct = async function() {
            let id = document.getElementById('prod-id').value;
            let name = document.getElementById('prod-name').value;
            let price = parseFloat(document.getElementById('prod-price').value);
            let category = document.getElementById('prod-category').value;
            let imageFile = document.getElementById('prod-image').files[0];

            if (!name || isNaN(price)) {
                alert("Please provide a valid name and price.");
                return;
            }

            try {
                if (id) {
                    let updateData = { name, price, category };
                    if (imageFile) updateData.imageUrl = await toBase64(imageFile);
                    await updateDoc(doc(db, "products", id), updateData);
                    alert("Product updated successfully!");
                } else {
                    let imageUrl = imageFile ? await toBase64(imageFile) : '';
                    await addDoc(collection(db, "products"), {
                        name, price, category, imageUrl,
                        vendor: currentUserEmail,
                        createdAt: Date.now()
                    });
                    alert("Product published successfully!");
                }
                closeModal();
                loadAffiliateProducts();
            } catch (e) {
                alert("Error saving product: " + e.message);
            }
        }

        window.deleteProduct = async function(id) {
            if (!confirm("Are you sure you want to delete this product?")) return;
            try {
                await deleteDoc(doc(db, "products", id));
                alert("Product deleted!");
                loadAffiliateProducts();
            } catch (e) {
                alert("Error deleting product: " + e.message);
            }
        }

        window.logout = async function() {
            await signOut(auth);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
